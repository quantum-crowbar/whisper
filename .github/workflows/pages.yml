# Publishes docs/ to GitHub Pages.
#
# This exists instead of the simpler "Deploy from a branch" setting because that
# flow always checks out submodules, and quantum-basics is a private repo the
# Pages builder has no credentials for — checkout failed, so the site never
# deployed. The devlog doesn't need the submodule, so we skip it.
#
# Requires Settings -> Pages -> Source: GitHub Actions.

name: Deploy docs to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the whole point — see header comment

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
